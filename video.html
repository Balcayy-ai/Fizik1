<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fizik 1 (FZM 105) - Kâğıt Poster Motion Graphics</title>
  <!-- Google Fonts: Oswald (bold condensed), Space Mono, Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --c-cream: #F3F0E6;
      --c-dark: #111410;
      --c-olive: #68725F;
      --c-lime: #D5FA73;
      --c-bg: #0B0D0A;
      --c-border: #232821;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--c-bg);
      color: var(--c-cream);
      font-family: 'Space Mono', monospace;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #player-layout {
      display: flex;
      flex-direction: column;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* ---------------- HEADER BAR ---------------- */
    #player-header {
      height: 48px;
      flex-shrink: 0;
      background: var(--c-dark);
      border-bottom: 2px solid var(--c-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }

    .header-left, .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--c-cream);
      color: var(--c-dark);
      padding: 6px 14px;
      border-radius: 4px;
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      transition: all 0.15s ease;
      border: 1px solid var(--c-dark);
      white-space: nowrap;
    }
    .btn-back:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    .header-badge {
      font-family: 'Oswald', sans-serif;
      font-weight: 900;
      font-size: 13px;
      letter-spacing: 1px;
      color: var(--c-lime);
      padding: 3px 8px;
      background: rgba(213, 250, 115, 0.1);
      border: 1px solid rgba(213, 250, 115, 0.3);
      border-radius: 3px;
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .scene-num {
      background: var(--c-lime);
      color: var(--c-dark);
      font-family: 'Oswald', sans-serif;
      font-weight: 900;
      font-size: 12px;
      padding: 2px 7px;
      border-radius: 3px;
    }

    .scene-title {
      font-family: 'Oswald', sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1px;
      color: var(--c-cream);
      text-transform: uppercase;
    }

    .header-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--c-border);
      color: var(--c-cream);
      padding: 5px 12px;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }
    .header-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--c-olive);
    }
    .header-btn.active {
      color: var(--c-lime);
      border-color: var(--c-lime);
    }

    /* ---------------- STAGE AREA (CANVAS CONTAINER) ---------------- */
    #stage-area {
      flex: 1;
      min-height: 0;
      min-width: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      background: radial-gradient(circle at center, #151a13 0%, #0B0D0A 100%);
      overflow: hidden;
    }

    #stage-container {
      width: 1920px;
      height: 1080px;
      flex-shrink: 0;
      position: relative;
      background: var(--c-cream);
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), 0 4px 20px rgba(0, 0, 0, 0.6);
      transform-origin: center center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 1920px;
      height: 1080px;
      display: block;
    }

    /* ---------------- CONTROLS DOCK ---------------- */
    #player-dock {
      height: 68px;
      flex-shrink: 0;
      background: var(--c-dark);
      border-top: 2px solid var(--c-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      gap: 16px;
      z-index: 100;
    }

    .dock-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .btn-play {
      background: var(--c-lime);
      color: var(--c-dark);
      border: 1px solid var(--c-dark);
      padding: 8px 18px;
      font-family: 'Oswald', sans-serif;
      font-weight: 900;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .btn-play:hover {
      background: #e5ff8c;
      transform: translateY(-1px);
    }

    .time-box {
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      color: var(--c-cream);
      min-width: 135px;
      white-space: nowrap;
    }
    .time-box .time-sep {
      color: var(--c-olive);
      margin: 0 4px;
    }

    .dock-center {
      flex: 1;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .timeline-wrap {
      position: relative;
      width: 100%;
      height: 22px;
      display: flex;
      align-items: center;
    }

    #time-slider {
      width: 100%;
      height: 8px;
      appearance: none;
      -webkit-appearance: none;
      background: #232821;
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      position: relative;
      z-index: 2;
      accent-color: var(--c-lime);
    }
    #time-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--c-lime);
      border: 2px solid var(--c-dark);
      cursor: pointer;
      box-shadow: 0 0 8px rgba(213, 250, 115, 0.6);
      transition: transform 0.1s;
    }
    #time-slider::-webkit-slider-thumb:hover {
      transform: scale(1.25);
    }

    .timeline-ticks {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
      z-index: 1;
    }
    .tick {
      position: absolute;
      top: 2px;
      bottom: 2px;
      width: 2px;
      background: rgba(213, 250, 115, 0.4);
      transform: translateX(-50%);
    }

    .chapter-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
    }
    .chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--c-border);
      color: #A3ACA0;
      padding: 3px 9px;
      border-radius: 3px;
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .chip:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--c-cream);
      border-color: var(--c-olive);
    }
    .chip.active {
      background: rgba(213, 250, 115, 0.15);
      color: var(--c-lime);
      border-color: var(--c-lime);
      font-weight: 700;
    }

    .dock-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .btn-speed {
      background: transparent;
      border: 1px solid var(--c-border);
      color: var(--c-cream);
      padding: 6px 10px;
      border-radius: 4px;
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-speed:hover {
      border-color: var(--c-lime);
      color: var(--c-lime);
    }

    .btn-open-slides {
      background: var(--c-cream);
      color: var(--c-dark);
      border: 1px solid var(--c-dark);
      padding: 7px 16px;
      font-family: 'Oswald', sans-serif;
      font-weight: 900;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-radius: 4px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-open-slides:hover {
      background: #ffffff;
      transform: translateY(-1px);
    }

    /* Headless mode for Chrome capture */
    body.headless #player-header,
    body.headless #player-dock {
      display: none !important;
    }
    body.headless #stage-area {
      padding: 0 !important;
      background: none !important;
    }
    body.headless #stage-container {
      box-shadow: none !important;
    }

    /* ---------------- RESPONSIVE MEDIA QUERIES ---------------- */
    .mobile-controls-row {
      display: contents;
    }
    .rotate-hint {
      display: none;
    }

    @media (max-width: 1024px) {
      .header-badge {
        font-size: 11px;
        padding: 2px 6px;
      }
      .scene-title {
        font-size: 12px;
      }
      .chapter-chips .chip {
        padding: 3px 6px;
        font-size: 10px;
      }
    }

    @media (max-width: 768px) {
      #player-layout {
        height: 100vh;
        height: 100dvh;
      }
      #player-header {
        height: 44px;
        padding: 0 8px;
      }
      .header-badge {
        display: none !important;
      }
      .scene-title {
        font-size: 11px;
        max-width: 130px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .scene-num {
        font-size: 11px;
        padding: 2px 5px;
      }
      .btn-back {
        padding: 5px 8px;
        font-size: 11px;
        gap: 4px;
      }
      .btn-back span {
        display: none;
      }
      .btn-back::after {
        content: "Sunum";
      }
      .header-btn {
        padding: 4px 7px;
        font-size: 11px;
      }
      #sfx-text, #fs-btn span {
        display: none;
      }

      /* Stage Area */
      #stage-area {
        padding: 8px;
        flex-direction: column;
        gap: 10px;
      }
      .rotate-hint {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: rgba(213, 250, 115, 0.12);
        color: var(--c-lime);
        border: 1px solid rgba(213, 250, 115, 0.3);
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 10.5px;
        font-family: 'Space Mono', monospace;
      }

      /* 2-Tier Dock on Mobile */
      #player-dock {
        height: 88px;
        padding: 6px 10px 8px 10px;
        flex-direction: column;
        justify-content: space-between;
        gap: 4px;
      }
      .dock-center {
        width: 100%;
        max-width: 100%;
        order: 1;
        gap: 0;
      }
      .timeline-wrap {
        width: 100%;
        height: 18px;
      }
      .chapter-chips {
        display: none !important;
      }
      .mobile-controls-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: 100%;
        order: 2;
      }
      .dock-left {
        gap: 8px;
      }
      .btn-play {
        padding: 6px 12px;
        font-size: 13px;
        gap: 4px;
      }
      .time-box {
        font-size: 11px;
        min-width: 80px;
      }
      .dock-right {
        gap: 6px;
      }
      .btn-speed {
        padding: 4px 7px;
        font-size: 11px;
      }
      .btn-open-slides {
        padding: 5px 10px;
        font-size: 12px;
        gap: 4px;
      }
    }

    @media (max-width: 900px) and (orientation: landscape) {
      #player-header {
        height: 36px;
        padding: 0 10px;
      }
      #player-dock {
        height: 52px;
        padding: 4px 10px;
        flex-direction: row;
      }
      .dock-center {
        order: 0;
      }
      .mobile-controls-row {
        display: contents;
      }
      .rotate-hint {
        display: none !important;
      }
    }

    /* ---------------- REMOVE NETLIFY BADGE & DRAWER ---------------- */
    iframe[src*="netlify"],
    iframe[id*="netlify"],
    iframe[title*="Netlify"],
    div[id*="netlify"],
    div[class*="netlify"],
    [data-netlify-badge],
    [data-netlify-drawer],
    netlify-drawer,
    #netlify-badge,
    .netlify-badge,
    a[href*="netlify.com"][style*="fixed"],
    a[href*="netlify.com"][style*="bottom"] {
      display: none !important;
      visibility: hidden !important;
      opacity: 0 !important;
      pointer-events: none !important;
      width: 0 !important;
      height: 0 !important;
      position: absolute !important;
      top: -9999px !important;
      left: -9999px !important;
      z-index: -9999 !important;
    }
  </style>
</head>
<body>

  <div id="player-layout">
    <header id="player-header">
      <div class="header-left">
        <a href="/" class="btn-back">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          <span>25 Slaytlık Sunum</span>
        </a>
        <span class="header-badge">FİZİK 1 // FZM 105</span>
      </div>

      <div class="header-center">
        <span class="scene-num" id="scene-num-badge">BÖLÜM 01</span>
        <span class="scene-title" id="scene-title-text">BOYUT ANALİZİ & DAİRESEL HAREKET</span>
      </div>

      <div class="header-right">
        <button id="sfx-toggle-btn" class="header-btn active" title="Foley Seslerini Aç/Kapat">
          <span>🔊</span> <span id="sfx-text">FOLEY SESİ: AÇIK</span>
        </button>
        <button id="fs-btn" class="header-btn" title="Tam Ekran">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
          <span>TAM EKRAN</span>
        </button>
      </div>
    </header>

    <main id="stage-area">
      <div class="rotate-hint">📱 En iyi deneyim için cihazı yatay çevirin</div>
      <div id="stage-container">
        <canvas id="main-canvas" width="1920" height="1080"></canvas>
      </div>
    </main>

    <footer id="player-dock">
      <div class="dock-center">
        <div class="timeline-wrap">
          <input type="range" id="time-slider" min="0" max="24" step="0.033" value="0">
          <div class="timeline-ticks">
            <div class="tick" style="left: 0%" title="01. Boyut (0.0s)"></div>
            <div class="tick" style="left: 18.75%" title="02. Hız & İvme (4.5s)"></div>
            <div class="tick" style="left: 39.58%" title="03. Kovalama (9.5s)"></div>
            <div class="tick" style="left: 62.5%" title="04. Vektörler (15.0s)"></div>
            <div class="tick" style="left: 80.0%" title="05. Final Poster (19.2s)"></div>
          </div>
        </div>

        <div class="chapter-chips">
          <button class="chip active" data-t="0">01. Boyut Analizi</button>
          <button class="chip" data-t="4.5">02. Kinematik & Hız</button>
          <button class="chip" data-t="9.5">03. Takip Problemi</button>
          <button class="chip" data-t="15.0">04. Vektör Cebiri</button>
          <button class="chip" data-t="19.2">05. Özet Poster</button>
        </div>
      </div>

      <div class="mobile-controls-row">
        <div class="dock-left">
          <button class="btn-play" id="play-btn">
            <span id="play-icon">▶</span>
            <span id="play-text">OYNAT</span>
          </button>
          <div class="time-box">
            <span id="current-time">00.00s</span>
            <span class="time-sep">/</span>
            <span id="total-time">24.00s</span>
          </div>
        </div>

        <div class="dock-right">
          <button class="btn-speed" id="speed-btn" title="Oynatma Hızı">1.0x</button>
          <a href="/" class="btn-open-slides" title="25 Slaytlık Sunumu Aç">📚 SUNUM</a>
        </div>
      </div>
    </footer>
  </div>

  <script>
    // Headless Detection
    if (new URLSearchParams(window.location.search).get('headless') === '1') {
      document.body.classList.add('headless');
    }

    const canvas = document.getElementById('main-canvas');
    const ctx = canvas.getContext('2d');
    const DURATION = 24.0;

    // Palette
    const C_CREAM = "#F3F0E6";
    const C_DARK  = "#111410";
    const C_OLIVE = "#68725F";
    const C_LIME  = "#D5FA73";

    // Static Paper Grain Texture
    const grainCanvas = document.createElement('canvas');
    grainCanvas.width = 300;
    grainCanvas.height = 300;
    const gctx = grainCanvas.getContext('2d');
    const gimg = gctx.createImageData(300, 300);
    for (let i = 0; i < gimg.data.length; i += 4) {
      const v = (Math.random() * 20 - 10);
      gimg.data[i] = 243 + v;
      gimg.data[i+1] = 240 + v;
      gimg.data[i+2] = 230 + v;
      gimg.data[i+3] = 24;
    }
    gctx.putImageData(gimg, 0, 0);

    // Helpers
    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }
    function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
    function easeOutBack(x) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }
    function smoothProg(t, start, end) {
      if (t <= start) return 0;
      if (t >= end) return 1;
      return easeInOutCubic((t - start) / (end - start));
    }

    // Realistic Washi Tape
    function drawTape(x, y, w, h, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle * Math.PI / 180);

      // Tape shadow
      ctx.fillStyle = "rgba(17, 20, 16, 0.15)";
      ctx.fillRect(-w/2 + 2, -h/2 + 3, w, h);

      // Semi-translucent lime tape body
      ctx.fillStyle = "rgba(213, 250, 115, 0.92)";
      ctx.fillRect(-w/2, -h/2, w, h);

      // Tape subtle border / cut end
      ctx.fillStyle = "rgba(17, 20, 16, 0.18)";
      ctx.fillRect(-w/2, h/2 - 2, w, 2);
      ctx.fillRect(-w/2, -h/2, 2, h);
      ctx.fillRect(w/2 - 2, -h/2, 2, h);

      ctx.restore();
    }

    // Crisp Arrow
    function drawArrow(fromX, fromY, toX, toY, color, width, headSize = 16) {
      const dx = toX - fromX;
      const dy = toY - fromY;
      const angle = Math.atan2(dy, dx);
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(toX, toY);
      ctx.lineTo(toX - headSize * Math.cos(angle - Math.PI / 6), toY - headSize * Math.sin(angle - Math.PI / 6));
      ctx.lineTo(toX - headSize * Math.cos(angle + Math.PI / 6), toY - headSize * Math.sin(angle + Math.PI / 6));
      ctx.fillStyle = color;
      ctx.fill();
    }

    // ---------------- MASTER SEEK RENDERER ----------------
    window.seek = function(t) {
      t = clamp(t, 0, DURATION);

      // 1. Base Paper
      ctx.fillStyle = C_CREAM;
      ctx.fillRect(0, 0, 1920, 1080);

      // 2. Grain
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.fillStyle = ctx.createPattern(grainCanvas, 'repeat');
      ctx.fillRect(0, 0, 1920, 1080);
      ctx.restore();

      // 3. Outer Poster Frame (50px margins, leaves generous 50px top/bottom)
      ctx.lineWidth = 4;
      ctx.strokeStyle = C_DARK;
      ctx.strokeRect(60, 50, 1800, 980);

      // 4. Top Header Banner
      ctx.fillStyle = C_DARK;
      ctx.font = "900 22px 'Oswald', sans-serif";
      ctx.fillText("FİZİK 1: MEKANİK ÇALIŞMA NOTLARI // FZM 105", 85, 95);

      ctx.font = "italic 700 16px 'Playfair Display', serif";
      ctx.fillStyle = C_OLIVE;
      ctx.fillText("~ Berk'ten Sevgilerle ~", 630, 95);

      ctx.font = "700 16px 'Space Mono', monospace";
      ctx.fillText("BÖLÜM 01-03: KİNEMATİK & VEKTÖR ANALİZİ", 1310, 95);

      ctx.beginPath();
      ctx.moveTo(60, 120);
      ctx.lineTo(1860, 120);
      ctx.strokeStyle = C_DARK;
      ctx.lineWidth = 2.5;
      ctx.stroke();

      // Washi Tapes on outer frame (neatly pinned on the 50px line, far above text)
      if (t < 19.2) {
        drawTape(320, 50, 80, 22, 2);
        drawTape(960, 50, 120, 24, -1);
        drawTape(1600, 50, 80, 22, -2);
      }

      // =============================================================
      // SCENE 1 (0.0s - 4.5s): BOYUT ANALİZİ & DAİRESEL İVME
      // =============================================================
      if (t < 5.0) {
        const s1Alpha = t < 4.0 ? 1 : 1 - (t - 4.0);
        ctx.save();
        ctx.globalAlpha = clamp(s1Alpha, 0, 1);

        const titleProg = smoothProg(t, 0.2, 0.9);
        ctx.fillStyle = C_DARK;
        ctx.font = "900 84px 'Oswald', sans-serif";
        ctx.fillText("01 // BOYUT ANALİZİ", 100, 215 - (1 - titleProg) * 20);

        ctx.font = "700 24px 'Playfair Display', serif";
        ctx.fillStyle = C_OLIVE;
        ctx.fillText("Doğa yasalarını yöneten üslerin matematiksel ve boyutsal tutarlılığı", 104, 260);

        // Left Dark Card
        const blockProg = smoothProg(t, 0.4, 1.2);
        const bw = 550 * blockProg;
        ctx.fillStyle = C_DARK;
        ctx.fillRect(100, 300, bw, 600);

        if (blockProg > 0.6) {
          ctx.fillStyle = C_CREAM;
          ctx.font = "900 32px 'Oswald', sans-serif";
          ctx.fillText("TEMEL SI BOYUTLARI", 140, 365);

          ctx.font = "400 18px 'Space Mono', monospace";
          ctx.fillStyle = "#A3ACA0";
          ctx.fillText("[L] = Uzunluk (metre)", 140, 425);
          ctx.fillText("[M] = Kütle (kilogram)", 140, 465);
          ctx.fillText("[T] = Zaman (saniye)", 140, 505);

          // Dimension Box
          ctx.fillStyle = C_LIME;
          ctx.fillRect(140, 550, 470, 75);
          ctx.fillStyle = C_DARK;
          ctx.font = "900 32px 'Oswald', sans-serif";
          ctx.fillText("[a] = [L] · [T]⁻² = m/s²", 165, 600);

          ctx.fillStyle = C_CREAM;
          ctx.font = "400 17px 'Space Mono', monospace";
          ctx.fillText("Model: a = k · r^n · v^m", 140, 680);
          ctx.fillText("Çözüm: n = -1,  m = 2", 140, 720);

          ctx.font = "700 15px 'Space Mono', monospace";
          ctx.fillStyle = C_LIME;
          ctx.fillText("Örnek 1: Dairesel Hareket", 140, 790);
        }

        // Right Illustration: Circular Motion Orbit
        const circProg = smoothProg(t, 0.8, 2.2);
        const cx = 1260, cy = 590, radius = 240;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2 * circProg);
        ctx.strokeStyle = C_OLIVE;
        ctx.lineWidth = 4;
        ctx.setLineDash([12, 10]);
        ctx.stroke();
        ctx.setLineDash([]);

        if (t >= 1.2) {
          const angle = (t - 1.2) * 2.3;
          const px = cx + Math.cos(angle) * radius;
          const py = cy + Math.sin(angle) * radius;

          // Glowing motion arc behind particle
          ctx.beginPath();
          ctx.arc(cx, cy, radius, angle - 0.7, angle);
          ctx.strokeStyle = C_LIME;
          ctx.lineWidth = 5;
          ctx.stroke();

          // Particle
          ctx.beginPath();
          ctx.arc(px, py, 18, 0, Math.PI * 2);
          ctx.fillStyle = C_DARK;
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = C_LIME;
          ctx.stroke();

          // Velocity vector (tangent)
          const vx = -Math.sin(angle) * 120;
          const vy = Math.cos(angle) * 120;
          drawArrow(px, py, px + vx, py + vy, C_DARK, 6, 18);
          ctx.font = "700 20px 'Space Mono', monospace";
          ctx.fillStyle = C_DARK;
          ctx.fillText("v (Hız)", px + vx + 12, py + vy + 6);

          // Centripetal acceleration (to center)
          const ax = -Math.cos(angle) * 150;
          const ay = -Math.sin(angle) * 150;
          drawArrow(px, py, px + ax, py + ay, C_LIME, 7, 20);
          ctx.fillText("a (İvme)", px + ax * 0.7 - 25, py + ay * 0.7 - 12);
        }

        // Stamped Result Formula
        if (t >= 2.0) {
          const stampProg = easeOutBack(clamp((t - 2.0) / 0.6, 0, 1));
          ctx.save();
          ctx.translate(1260, 590);
          ctx.scale(stampProg, stampProg);
          ctx.fillStyle = C_CREAM;
          ctx.fillRect(-180, -65, 360, 130);
          ctx.lineWidth = 4;
          ctx.strokeStyle = C_DARK;
          ctx.strokeRect(-180, -65, 360, 130);
          ctx.fillStyle = C_DARK;
          ctx.font = "900 52px 'Oswald', sans-serif";
          ctx.textAlign = "center";
          ctx.fillText("a = v² / r", 0, 10);
          ctx.font = "700 16px 'Space Mono', monospace";
          ctx.fillStyle = C_OLIVE;
          ctx.fillText("MERKEZCİL İVME DENGESİ", 0, 46);
          ctx.textAlign = "left";
          ctx.restore();
        }

        ctx.restore();
      }

      // =============================================================
      // SCENE 2 (4.2s - 10.0s): TEK BOYUTTA HAREKET & İŞARET KURALI
      // =============================================================
      if (t >= 4.2 && t < 10.0) {
        const s2In = smoothProg(t, 4.2, 5.0);
        const s2Out = t > 9.0 ? 1 - smoothProg(t, 9.0, 9.8) : 1;
        ctx.save();
        ctx.globalAlpha = s2In * s2Out;

        ctx.fillStyle = C_DARK;
        ctx.font = "900 84px 'Oswald', sans-serif";
        ctx.fillText("02 // HIZ VE İVME VEKTÖRLERİ", 100, 215);
        ctx.font = "700 24px 'Playfair Display', serif";
        ctx.fillStyle = C_OLIVE;
        ctx.fillText("Hız ve ivme aynı yönlüyse cisim hızlanır, zıt yönlüyse yavaşlar", 104, 260);

        // Linear track
        const axisY = 420;
        ctx.beginPath();
        ctx.moveTo(120, axisY);
        ctx.lineTo(1800, axisY);
        ctx.strokeStyle = C_DARK;
        ctx.lineWidth = 5;
        ctx.stroke();

        for (let x = 180; x <= 1720; x += 154) {
          ctx.beginPath();
          ctx.moveTo(x, axisY - 10);
          ctx.lineTo(x, axisY + 10);
          ctx.strokeStyle = C_OLIVE;
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.font = "700 14px 'Space Mono', monospace";
          ctx.fillStyle = C_OLIVE;
          const mVal = Math.round((x - 180) / 15.4);
          ctx.fillText(`${mVal}m`, x - 14, axisY + 34);
        }

        // Particle Moving Along Axis with deceleration
        const motionP = clamp((t - 5.0) / 3.8, 0, 1);
        const carX = 200 + (1380 * (1 - Math.pow(1 - motionP, 2)));

        // Brake skid mark line behind vehicle
        if (motionP > 0.04) {
          ctx.beginPath();
          ctx.moveTo(200, axisY + 1);
          ctx.lineTo(carX - 45, axisY + 1);
          ctx.strokeStyle = "rgba(17, 20, 16, 0.28)";
          ctx.lineWidth = 4;
          ctx.setLineDash([8, 6]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        ctx.fillStyle = "rgba(17, 20, 16, 0.25)";
        ctx.beginPath();
        ctx.ellipse(carX, axisY + 16, 48, 10, 0, 0, Math.PI * 2);
        ctx.fill();

        // Vehicle Block
        ctx.fillStyle = C_DARK;
        ctx.fillRect(carX - 45, axisY - 45, 90, 45);
        ctx.fillStyle = C_LIME;
        ctx.fillRect(carX + 15, axisY - 35, 20, 20); // Headlight/window
        ctx.fillStyle = C_CREAM;
        ctx.fillRect(carX - 35, axisY - 15, 25, 12);

        // Forward Velocity Vector v (Lime Arrow)
        const vLen = Math.max(0, 260 * (1 - motionP));
        if (vLen > 25) {
          drawArrow(carX + 45, axisY - 22, carX + 45 + vLen, axisY - 22, C_LIME, 8, 20);
          ctx.fillStyle = C_DARK;
          ctx.font = "900 24px 'Oswald', sans-serif";
          ctx.fillText(`v > 0 (${Math.round(30 * (1 - motionP))} m/s)`, carX + 55 + vLen, axisY - 14);
        }

        // Backward Acceleration Vector a
        const aLen = 180;
        drawArrow(carX - 45, axisY - 22, carX - 45 - aLen, axisY - 22, C_DARK, 8, 20);
        ctx.fillStyle = C_DARK;
        ctx.font = "900 24px 'Oswald', sans-serif";
        ctx.fillText("a < 0 (-5 m/s²)", carX - 45 - aLen - 175, axisY - 14);

        // 4 State Matrix Cards - Generous 170px breathing room from bottom
        const matY = 570;
        const cardH = 280;
        const cardW = 415;
        const boxes = [
          { v: "v > 0  |  a > 0", state: "POZİTİF HIZLANAN", desc: "Aynı yönlü hareket,", desc2: "hız ve sürat artar", active: false },
          { v: "v > 0  |  a < 0", state: "POZİTİF YAVAŞLAYAN", desc: "Zıt yönlü: Frenleme,", desc2: "Durma Mesafesi Δx = 90m", active: true },
          { v: "v < 0  |  a > 0", state: "NEGATİF YAVAŞLAYAN", desc: "Ters yönde hareket,", desc2: "yavaşlayarak durur", active: false },
          { v: "v < 0  |  a < 0", state: "NEGATİF HIZLANAN", desc: "Ters yönde ivmelenir,", desc2: "negatif sürat artar", active: false }
        ];

        boxes.forEach((b, i) => {
          const bx = 95 + i * 440;
          ctx.fillStyle = b.active ? C_DARK : "#E8E4D8";
          ctx.fillRect(bx, matY, cardW, cardH);
          ctx.lineWidth = 3;
          ctx.strokeStyle = C_DARK;
          ctx.strokeRect(bx, matY, cardW, cardH);

          if (b.active) {
            drawTape(bx + cardW / 2, matY, 110, 24, 0);
          }

          ctx.fillStyle = b.active ? C_LIME : C_DARK;
          ctx.font = "900 28px 'Oswald', sans-serif";
          ctx.fillText(b.v, bx + 28, matY + 65);

          ctx.font = "900 22px 'Oswald', sans-serif";
          ctx.fillStyle = b.active ? C_CREAM : C_DARK;
          ctx.fillText(b.state, bx + 28, matY + 118);

          ctx.font = "400 16px 'Space Mono', monospace";
          ctx.fillStyle = b.active ? "#C2C9BE" : C_OLIVE;
          ctx.fillText(b.desc, bx + 28, matY + 165);
          ctx.fillText(b.desc2, bx + 28, matY + 195);

          if (b.active) {
            ctx.fillStyle = C_LIME;
            ctx.font = "700 17px 'Space Mono', monospace";
            ctx.fillText("Örnek 2: Δx = 90m (t = 6s)", bx + 28, matY + 245);
          }
        });

        ctx.restore();
      }

      // =============================================================
      // SCENE 3 (9.2s - 15.5s): KOVALAMA PROBLEMİ (Polis & Hız İhlali)
      // =============================================================
      if (t >= 9.2 && t < 15.5) {
        const s3In = smoothProg(t, 9.2, 10.0);
        const s3Out = t > 14.5 ? 1 - smoothProg(t, 14.5, 15.3) : 1;
        ctx.save();
        ctx.globalAlpha = s3In * s3Out;

        ctx.fillStyle = C_DARK;
        ctx.font = "900 84px 'Oswald', sans-serif";
        ctx.fillText("03 // KOVALAMA PROBLEMİ: POLİS & İHLAL", 100, 215);
        ctx.font = "700 24px 'Playfair Display', serif";
        ctx.fillStyle = C_OLIVE;
        ctx.fillText("Maksimum mesafe: Polisin hızı araca eşitlendiğinde gerçekleşir (dS/dt = 0)", 104, 260);

        // Coordinate Graph for Chase
        const gx = 180, gy = 860, gw = 960, gh = 480;
        ctx.beginPath();
        ctx.moveTo(gx, gy - gh);
        ctx.lineTo(gx, gy);
        ctx.lineTo(gx + gw, gy);
        ctx.strokeStyle = C_DARK;
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.font = "700 18px 'Space Mono', monospace";
        ctx.fillStyle = C_DARK;
        ctx.fillText("Konum x (metre)", gx - 40, gy - gh - 20);
        ctx.fillText("Zaman t (s)", gx + gw + 15, gy + 8);

        const tScale = gw / 12;
        const yScale = gh / 180;

        ctx.fillText("t = 0", gx, gy + 32);
        ctx.fillText("t = 5s (Maksimum)", gx + 5 * tScale - 75, gy + 32);
        ctx.fillText("t = 10s (Yakalama)", gx + 10 * tScale - 75, gy + 32);

        // Dashed lines
        ctx.beginPath();
        ctx.moveTo(gx + 5 * tScale, gy);
        ctx.lineTo(gx + 5 * tScale, gy - 75 * yScale);
        ctx.moveTo(gx + 10 * tScale, gy);
        ctx.lineTo(gx + 10 * tScale, gy - 150 * yScale);
        ctx.strokeStyle = C_OLIVE;
        ctx.setLineDash([8, 8]);
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.setLineDash([]);

        const curT = clamp((t - 10.0) / 4.0 * 11, 0, 11);

        // 1. Car line (Linear)
        ctx.beginPath();
        ctx.moveTo(gx, gy);
        for (let st = 0; st <= curT; st += 0.2) {
          ctx.lineTo(gx + st * tScale, gy - (15 * st) * yScale);
        }
        ctx.strokeStyle = C_DARK;
        ctx.lineWidth = 5;
        ctx.stroke();

        if (curT > 2) {
          ctx.font = "900 20px 'Oswald', sans-serif";
          ctx.fillStyle = C_DARK;
          ctx.fillText("x_araç = 15t (Sabit Hızlı Araç)", gx + 2 * tScale, gy - 30 * yScale - 35);
        }

        // 2. Police Parabola
        ctx.beginPath();
        ctx.moveTo(gx, gy);
        for (let st = 0; st <= curT; st += 0.2) {
          ctx.lineTo(gx + st * tScale, gy - (1.5 * st * st) * yScale);
        }
        ctx.strokeStyle = C_LIME;
        ctx.lineWidth = 6;
        ctx.stroke();

        if (curT > 5) {
          ctx.font = "900 22px 'Oswald', sans-serif";
          ctx.fillStyle = C_DARK;
          ctx.fillText("x_polis = 1.5t² (İvmeli Polis)", gx + 7.5 * tScale - 110, gy - (1.5 * 7.5 * 7.5) * yScale - 22);
        }

        // Gap highlight at t = 5s
        if (curT >= 5.0) {
          const x5 = gx + 5 * tScale;
          const yCar = gy - 75 * yScale;
          const yPol = gy - 37.5 * yScale;

          drawArrow(x5, yCar, x5, yPol, C_DARK, 4, 14);
          drawArrow(x5, yPol, x5, yCar, C_DARK, 4, 14);

          ctx.fillStyle = C_LIME;
          ctx.fillRect(x5 + 20, (yCar + yPol) / 2 - 25, 230, 50);
          ctx.lineWidth = 2;
          ctx.strokeStyle = C_DARK;
          ctx.strokeRect(x5 + 20, (yCar + yPol) / 2 - 25, 230, 50);

          ctx.fillStyle = C_DARK;
          ctx.font = "900 22px 'Oswald', sans-serif";
          ctx.fillText("ΔS_maks = 37.5 m", x5 + 35, (yCar + yPol) / 2 + 8);
        }

        // Catch event at t = 10s
        if (curT >= 10.0) {
          const x10 = gx + 10 * tScale;
          const y10 = gy - 150 * yScale;
          ctx.beginPath();
          ctx.arc(x10, y10, 14, 0, Math.PI * 2);
          ctx.fillStyle = C_LIME;
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = C_DARK;
          ctx.fillRect(x10 + 25, y10 - 30, 240, 60);
          ctx.fillStyle = C_CREAM;
          ctx.font = "900 24px 'Oswald', sans-serif";
          ctx.fillText("YAKALAMA: t = 10s", x10 + 40, y10 + 8);
        }

        // Right Info Card
        ctx.fillStyle = C_DARK;
        ctx.fillRect(1240, 320, 600, 540);
        ctx.lineWidth = 3;
        ctx.strokeStyle = C_LIME;
        ctx.strokeRect(1240, 320, 600, 540);

        ctx.fillStyle = C_CREAM;
        ctx.font = "900 32px 'Oswald', sans-serif";
        ctx.fillText("TÜREVSEL ÇÖZÜM", 1280, 380);

        ctx.font = "400 17px 'Space Mono', monospace";
        ctx.fillStyle = "#A3ACA0";
        ctx.fillText("Mesafe Fonksiyonu:", 1280, 430);
        ctx.fillStyle = C_LIME;
        ctx.font = "700 22px 'Space Mono', monospace";
        ctx.fillText("S(t) = 15t - 1.5t²", 1280, 470);

        ctx.font = "400 17px 'Space Mono', monospace";
        ctx.fillStyle = "#A3ACA0";
        ctx.fillText("Maksimum için dS/dt = 0:", 1280, 530);
        ctx.fillStyle = C_CREAM;
        ctx.fillText("15 - 3t = 0  ==>  t = 5 s", 1280, 570);

        ctx.fillStyle = C_LIME;
        ctx.fillRect(1280, 640, 520, 95);
        ctx.fillStyle = C_DARK;
        ctx.font = "900 30px 'Oswald', sans-serif";
        ctx.fillText("v_polis(10s) = 30 m/s", 1310, 695);
        ctx.font = "700 15px 'Space Mono', monospace";
        ctx.fillText("İhlal yapan aracın tam 2 katı!", 1310, 720);

        ctx.restore();
      }

      // =============================================================
      // SCENE 4 (14.8s - 20.0s): VEKTÖR CEBİRİ & BİRİM VEKTÖRLER
      // =============================================================
      if (t >= 14.8 && t < 20.0) {
        const s4In = smoothProg(t, 14.8, 15.6);
        const s4Out = t > 19.0 ? 1 - smoothProg(t, 19.0, 19.8) : 1;
        ctx.save();
        ctx.globalAlpha = s4In * s4Out;

        ctx.fillStyle = C_DARK;
        ctx.font = "900 84px 'Oswald', sans-serif";
        ctx.fillText("04 // VEKTÖR CEBİRİ & BİRİM VEKTÖRLER", 100, 215);
        ctx.font = "700 24px 'Playfair Display', serif";
        ctx.fillStyle = C_OLIVE;
        ctx.fillText("Analitik toplama: R = (A_x + B_x) i + (A_y + B_y) j", 104, 260);

        // Cartesian Grid
        const ox = 500, oy = 720;
        ctx.beginPath();
        for (let x = 140; x <= 1020; x += 70) {
          ctx.moveTo(x, 320); ctx.lineTo(x, 860);
        }
        for (let y = 320; y <= 860; y += 70) {
          ctx.moveTo(140, y); ctx.lineTo(1020, y);
        }
        ctx.strokeStyle = "rgba(104, 114, 95, 0.25)";
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(140, oy); ctx.lineTo(1050, oy);
        ctx.moveTo(ox, 860); ctx.lineTo(ox, 320);
        ctx.strokeStyle = C_DARK;
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.font = "900 22px 'Oswald', sans-serif";
        ctx.fillStyle = C_DARK;
        ctx.fillText("+X (i birim)", 1060, oy + 8);
        ctx.fillText("+Y (j birim)", ox - 20, 310);

        const vecProg = smoothProg(t, 15.5, 17.0);
        const ax = 280 * vecProg;
        const ay = -140 * vecProg;

        drawArrow(ox, oy, ox + ax, oy + ay, C_DARK, 6, 18);
        ctx.font = "900 26px 'Oswald', sans-serif";
        ctx.fillText("A Vektörü", ox + ax / 2 - 35, oy + ay / 2 - 15);

        if (t >= 16.5) {
          const bProg = smoothProg(t, 16.5, 17.8);
          const bx = 180 * bProg;
          const by = -160 * bProg;

          drawArrow(ox + 280, oy - 140, ox + 280 + bx, oy - 140 + by, C_OLIVE, 6, 18);
          ctx.fillText("B Vektörü", ox + 280 + bx / 2 + 15, oy - 140 + by / 2);

          if (t >= 17.5) {
            const rProg = smoothProg(t, 17.5, 18.5);
            const rx = (280 + 180) * rProg;
            const ry = (-140 - 160) * rProg;

            // Dashed projection lines
            if (rProg > 0.5) {
              ctx.beginPath();
              ctx.moveTo(ox + rx, oy + ry);
              ctx.lineTo(ox + rx, oy);
              ctx.moveTo(ox + rx, oy + ry);
              ctx.lineTo(ox, oy + ry);
              ctx.strokeStyle = "rgba(104, 114, 95, 0.4)";
              ctx.setLineDash([6, 6]);
              ctx.lineWidth = 2;
              ctx.stroke();
              ctx.setLineDash([]);
            }

            drawArrow(ox, oy, ox + rx, oy + ry, C_LIME, 8, 22);

            if (rProg > 0.7) {
              ctx.save();
              ctx.font = "900 28px 'Oswald', sans-serif";
              ctx.fillStyle = C_DARK;
              ctx.textAlign = "right";
              ctx.fillText("BİLEŞKE R = A + B", ox + rx - 20, oy + ry - 15);
              ctx.restore();
            }
          }
        }

        // Right Side Card
        ctx.fillStyle = C_DARK;
        ctx.fillRect(1160, 320, 680, 540);
        ctx.lineWidth = 4;
        ctx.strokeStyle = C_DARK;
        ctx.strokeRect(1160, 320, 680, 540);

        ctx.fillStyle = C_CREAM;
        ctx.font = "900 36px 'Oswald', sans-serif";
        ctx.fillText("BİLEŞENLER VE BİRİM VEKTÖRLER", 1200, 390);

        ctx.font = "400 18px 'Space Mono', monospace";
        ctx.fillStyle = "#A3ACA0";
        ctx.fillText("• |i| = |j| = |k| = 1 (Büyüklüğü 1 birim)", 1200, 450);
        ctx.fillText("• A_x = A · cos(θ),   A_y = A · sin(θ)", 1200, 500);
        ctx.fillText("• Büyüklük: R = √(R_x² + R_y²)", 1200, 550);
        ctx.fillText("• Doğrultu: θ = arctan(R_y / R_x)", 1200, 600);

        ctx.fillStyle = C_LIME;
        ctx.fillRect(1200, 660, 600, 120);
        ctx.fillStyle = C_DARK;
        ctx.font = "900 34px 'Oswald', sans-serif";
        ctx.fillText("R = (A_x + B_x) i + (A_y + B_y) j", 1230, 730);

        ctx.restore();
      }

      // =============================================================
      // SCENE 5 (19.2s - 24.0s): BÜYÜK FİNAL & KÂĞIT POSTER BASKISI
      // =============================================================
      if (t >= 19.2) {
        const s5In = smoothProg(t, 19.2, 20.2);
        ctx.save();
        ctx.globalAlpha = s5In;

        const finalScale = 0.96 + 0.04 * s5In;
        ctx.translate(960, 540);
        ctx.scale(finalScale, finalScale);
        ctx.translate(-960, -540);

        ctx.fillStyle = C_DARK;
        ctx.fillRect(120, 160, 1680, 780);

        drawTape(960, 160, 160, 36, 0);
        drawTape(200, 160, 90, 28, -3);
        drawTape(1720, 160, 90, 28, 3);

        ctx.fillStyle = C_LIME;
        ctx.font = "900 78px 'Oswald', sans-serif";
        ctx.fillText("FİZİK 1: DOĞRUSAL HAREKET VE VEKTÖRLER", 180, 285);

        ctx.font = "700 26px 'Playfair Display', serif";
        ctx.fillStyle = C_CREAM;
        ctx.fillText("FZM 105 • Ders Notları & Formül Mimarisi", 185, 335);

        const cols = [
          {
            title: "01 // BOYUT & SI",
            f: "a = v² / r",
            sub: "[L][T]⁻² = Boyut Dengesi",
            note1: "Tüm fiziksel formüller",
            note2: "boyut analiziyle türetilir."
          },
          {
            title: "02 // KİNEMATİK",
            f: "v_s² = v_i² + 2aΔx",
            sub: "x_s = x_i + v_xi·t + ½at²",
            note1: "v ve a aynı işaretliyse hızlanır,",
            note2: "zıt işaretliyse yavaşlar."
          },
          {
            title: "03 // VEKTÖRLER",
            f: "R = Σ A_x i + Σ A_y j",
            sub: "R = √(R_x² + R_y²)",
            note1: "Fiziksel nicelikler dik",
            note2: "bileşenleriyle toplanır."
          }
        ];

        cols.forEach((c, idx) => {
          const cx = 180 + idx * 530;
          ctx.fillStyle = C_CREAM;
          ctx.fillRect(cx, 390, 480, 480);
          ctx.lineWidth = 3;
          ctx.strokeStyle = C_LIME;
          ctx.strokeRect(cx, 390, 480, 480);

          ctx.fillStyle = C_DARK;
          ctx.font = "900 28px 'Oswald', sans-serif";
          ctx.fillText(c.title, cx + 30, 445);

          ctx.fillStyle = C_DARK;
          ctx.font = "900 36px 'Oswald', sans-serif";
          ctx.fillText(c.f, cx + 30, 520);

          ctx.font = "700 20px 'Space Mono', monospace";
          ctx.fillStyle = C_OLIVE;
          ctx.fillText(c.sub, cx + 30, 570);

          ctx.font = "400 17px 'Space Mono', monospace";
          ctx.fillStyle = C_DARK;
          ctx.fillText(c.note1, cx + 30, 640);
          ctx.fillText(c.note2, cx + 30, 670);

          ctx.fillStyle = C_LIME;
          ctx.fillRect(cx + 30, 770, 240, 48);
          ctx.lineWidth = 2.5;
          ctx.strokeStyle = C_DARK;
          ctx.strokeRect(cx + 30, 770, 240, 48);

          ctx.fillStyle = C_DARK;
          ctx.font = "900 20px 'Oswald', sans-serif";
          ctx.fillText("ONAYLANMIŞ TEORİ", cx + 45, 802);
        });

        ctx.restore();
      }
    };

    // ---------------- UI & AUDIO INTERACTION ----------------
    let isPlaying = false;
    let startTime = 0;
    let playbackTime = 0;
    let playbackSpeed = 1.0;
    let sfxEnabled = true;

    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const playText = document.getElementById('play-text');
    const timeSlider = document.getElementById('time-slider');
    const currentTimeText = document.getElementById('current-time');
    const sceneNumBadge = document.getElementById('scene-num-badge');
    const sceneTitleText = document.getElementById('scene-title-text');
    const speedBtn = document.getElementById('speed-btn');
    const sfxToggleBtn = document.getElementById('sfx-toggle-btn');
    const sfxText = document.getElementById('sfx-text');
    const fsBtn = document.getElementById('fs-btn');
    const chapterChips = document.querySelectorAll('.chapter-chips .chip');

    const scenes = [
      { t: 0.0, num: "BÖLÜM 01", title: "BOYUT ANALİZİ & DAİRESEL HAREKET" },
      { t: 4.5, num: "BÖLÜM 02", title: "TEK BOYUTTA HAREKET & HIZ-İVME" },
      { t: 9.5, num: "BÖLÜM 03", title: "KOVALAMA PROBLEMİ: POLİS & İHLAL" },
      { t: 15.0, num: "BÖLÜM 04", title: "VEKTÖR CEBİRİ & BİRİM VEKTÖRLER" },
      { t: 19.2, num: "BÖLÜM 05", title: "KÂĞIT POSTER FİNAL ÖZETİ" }
    ];

    function updateSceneIndicator(t) {
      let activeIdx = 0;
      for (let i = scenes.length - 1; i >= 0; i--) {
        if (t >= scenes[i].t) {
          activeIdx = i;
          break;
        }
      }
      sceneNumBadge.textContent = scenes[activeIdx].num;
      sceneTitleText.textContent = scenes[activeIdx].title;

      chapterChips.forEach((chip, idx) => {
        if (idx === activeIdx) {
          chip.classList.add('active');
        } else {
          chip.classList.remove('active');
        }
      });
    }

    // Web Audio Sound Effects
    let audioCtx = null;
    let lastSoundTrigger = -1;

    function playSfx(type) {
      if (!sfxEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'paper') {
          const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.15, audioCtx.sampleRate);
          const out = buf.getChannelData(0);
          for (let i = 0; i < out.length; i++) out[i] = (Math.random() * 2 - 1) * Math.exp(-i / (out.length * 0.4));
          const src = audioCtx.createBufferSource();
          src.buffer = buf;
          const flt = audioCtx.createBiquadFilter();
          flt.type = 'bandpass';
          flt.frequency.setValueAtTime(1200, now);
          flt.Q.setValueAtTime(2.0, now);
          const gn = audioCtx.createGain();
          gn.gain.setValueAtTime(0.12, now);
          gn.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          src.connect(flt); flt.connect(gn); gn.connect(audioCtx.destination);
          src.start(now);
        } else if (type === 'stamp') {
          const osc = audioCtx.createOscillator();
          const gn = audioCtx.createGain();
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(45, now + 0.18);
          gn.gain.setValueAtTime(0.22, now);
          gn.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
          osc.connect(gn); gn.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.18);
        } else if (type === 'snap') {
          const osc = audioCtx.createOscillator();
          const gn = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, now);
          osc.frequency.exponentialRampToValueAtTime(300, now + 0.08);
          gn.gain.setValueAtTime(0.12, now);
          gn.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gn); gn.connect(audioCtx.destination);
          osc.start(now); osc.stop(now + 0.08);
        }
      } catch (e) {}
    }

    const soundEvents = [
      { t: 0.2, type: 'paper' },
      { t: 2.0, type: 'stamp' },
      { t: 4.3, type: 'paper' },
      { t: 6.8, type: 'stamp' },
      { t: 9.3, type: 'paper' },
      { t: 12.0, type: 'snap' },
      { t: 14.8, type: 'paper' },
      { t: 17.5, type: 'snap' },
      { t: 19.3, type: 'stamp' },
      { t: 21.0, type: 'snap' }
    ];

    function checkSoundTriggers(currentT) {
      soundEvents.forEach((ev, idx) => {
        if (currentT >= ev.t && currentT < ev.t + 0.15 && lastSoundTrigger !== idx) {
          lastSoundTrigger = idx;
          playSfx(ev.type);
        }
      });
    }

    function renderLoop() {
      if (isPlaying) {
        const now = performance.now();
        playbackTime = (now - startTime) / 1000 * playbackSpeed;
        if (playbackTime > DURATION) {
          playbackTime = 0;
          startTime = performance.now();
          lastSoundTrigger = -1;
        }
        timeSlider.value = playbackTime;
        currentTimeText.textContent = `${playbackTime.toFixed(2)}s`;
        window.seek(playbackTime);
        updateSceneIndicator(playbackTime);
        checkSoundTriggers(playbackTime);
        requestAnimationFrame(renderLoop);
      }
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      playIcon.textContent = isPlaying ? "⏸" : "▶";
      playText.textContent = isPlaying ? "DURDUR" : "OYNAT";
      if (isPlaying) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        startTime = performance.now() - (playbackTime / playbackSpeed) * 1000;
        renderLoop();
      }
    }

    playBtn.addEventListener('click', togglePlay);

    timeSlider.addEventListener('input', (e) => {
      isPlaying = false;
      playIcon.textContent = "▶";
      playText.textContent = "OYNAT";
      playbackTime = parseFloat(e.target.value);
      currentTimeText.textContent = `${playbackTime.toFixed(2)}s`;
      window.seek(playbackTime);
      updateSceneIndicator(playbackTime);
    });

    chapterChips.forEach(chip => {
      chip.addEventListener('click', () => {
        const targetT = parseFloat(chip.getAttribute('data-t'));
        playbackTime = targetT;
        timeSlider.value = targetT;
        currentTimeText.textContent = `${targetT.toFixed(2)}s`;
        window.seek(targetT);
        updateSceneIndicator(targetT);
        playSfx('snap');
        if (isPlaying) {
          startTime = performance.now() - (playbackTime / playbackSpeed) * 1000;
        }
      });
    });

    // Speed toggle
    const speeds = [1.0, 1.5, 2.0, 0.5];
    let speedIdx = 0;
    speedBtn.addEventListener('click', () => {
      speedIdx = (speedIdx + 1) % speeds.length;
      playbackSpeed = speeds[speedIdx];
      speedBtn.textContent = `${playbackSpeed.toFixed(1)}x`;
      if (isPlaying) {
        startTime = performance.now() - (playbackTime / playbackSpeed) * 1000;
      }
    });

    // SFX toggle
    sfxToggleBtn.addEventListener('click', () => {
      sfxEnabled = !sfxEnabled;
      sfxToggleBtn.classList.toggle('active', sfxEnabled);
      sfxText.textContent = sfxEnabled ? "FOLEY SESİ: AÇIK" : "FOLEY SESİ: KAPALI";
    });

    // Fullscreen toggle
    fsBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    // Keyboard shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        togglePlay();
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        playbackTime = Math.max(0, playbackTime - 2);
        timeSlider.value = playbackTime;
        currentTimeText.textContent = `${playbackTime.toFixed(2)}s`;
        window.seek(playbackTime);
        updateSceneIndicator(playbackTime);
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        playbackTime = Math.min(DURATION, playbackTime + 2);
        timeSlider.value = playbackTime;
        currentTimeText.textContent = `${playbackTime.toFixed(2)}s`;
        window.seek(playbackTime);
        updateSceneIndicator(playbackTime);
      } else if (e.code === 'KeyF') {
        fsBtn.click();
      } else if (e.code === 'Digit1') chapterChips[0].click();
      else if (e.code === 'Digit2') chapterChips[1].click();
      else if (e.code === 'Digit3') chapterChips[2].click();
      else if (e.code === 'Digit4') chapterChips[3].click();
      else if (e.code === 'Digit5') chapterChips[4].click();
    });

    // ---------------- ACCURATE ZERO-OVERFLOW RESIZE ----------------
    function resize() {
      const stageArea = document.getElementById('stage-area');
      if (!stageArea) return;
      const availW = stageArea.clientWidth - 24;
      const availH = stageArea.clientHeight - 24;
      const scale = Math.min(availW / 1920, availH / 1080);
      const stage = document.getElementById('stage-container');
      if (stage) {
        stage.style.transform = `scale(${scale})`;
      }
    }

    window.addEventListener('resize', resize);
    resize();

    // Initial render at t = 0
    window.seek(0);
    updateSceneIndicator(0);

    // Auto-remove Netlify badge/drawer
    (function() {
      function purgeNetlifyBadge() {
        const selectors = [
          'iframe[src*="netlify"]',
          'iframe[id*="netlify"]',
          'iframe[title*="Netlify"]',
          'div[id*="netlify"]',
          'div[class*="netlify"]',
          '[data-netlify-badge]',
          '[data-netlify-drawer]',
          'netlify-drawer',
          '#netlify-badge',
          '.netlify-badge'
        ];
        selectors.forEach(sel => {
          document.querySelectorAll(sel).forEach(el => el.remove());
        });
        document.querySelectorAll('a[href*="netlify.com"]').forEach(el => {
          const style = window.getComputedStyle(el);
          if (style.position === 'fixed' || style.position === 'absolute') {
            el.remove();
          }
        });
      }
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', purgeNetlifyBadge);
      } else {
        purgeNetlifyBadge();
      }
      const obs = new MutationObserver((mutations) => {
        for (const m of mutations) {
          if (m.addedNodes.length > 0) purgeNetlifyBadge();
        }
      });
      obs.observe(document.documentElement, { childList: true, subtree: true });
    })();
  </script>
</body>
</html>
